[package]
name = "rust-SMTP"
version = "0.1.0"
edition = "2024"

[dependencies]
direct_to_mx = "0.3.2"
dotenvy = "0.15.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
